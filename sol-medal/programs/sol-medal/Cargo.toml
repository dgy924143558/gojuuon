[package]
name = "sol-medal"
version = "0.1.0"
description = "SolMedal NFT - Blockchain medal certification system"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_medal"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
mpl-token-metadata = "4.1.2"
